[package]
name = "cockatiel_tts_rs"
version = "0.1.0"
edition = "2021"
description = "Cockatiel module — local text-to-speech (TTS) via sherpa-onnx / Piper VITS models"
license = "GPL-2.0"

[dependencies]
cockatiel-client = { git = "https://github.com/vulbyte/cockatiel_client-rs", rev = "16120ab927d35c14baf059d5be7d5c6bb37d78bc" }
sherpa-onnx = "1.13"
ureq = "2"
bzip2 = "0.4"
tar = "0.4"
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v7"] }